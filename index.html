los sujetos obligados (entidades esenciales e importantes), fija una <b>alerta temprana en 24 h</b>, una <b>notificación en 72 h</b> y un <b>informe final en 1 mes</b>.</p><div class=\"note warn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 9v4M12 17h.01\"/><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/></svg><div><b>Dato a verificar cada curso.</b> A julio de 2026 la Ley española de transposición de NIS2 <b>seguía sin publicarse en el BOE</b>. Mientras no se publique, los plazos aplicables provienen del RGPD y de la propia Directiva NIS2. Comprobar el estado en el BOE al inicio de cada curso.</div></div>"}, {"h": "4. Comunicación multi-audiencia y gestión de crisis", "html": "<p>El mismo incidente debe traducirse a <b>públicos distintos</b> sin alterar los hechos: al <b>técnico</b> que tiene que actuar (breve y accionable), al <b>responsable de TI</b> (con impacto y decisiones pendientes), a la <b>dirección</b> (sin jerga, con coste y riesgo legal) y a la <b>plantilla o la ciudadanía</b> (qué deben hacer y qué no). Las reglas de oro son la <b>doble redacción</b> (trabajar primero con marcadores como <code>[N] afectados</code> y sustituir los datos reales en local y al final), la <b>verificación de plazos en la fuente primaria</b> y la <b>revisión cruzada</b> de tres lecturas antes de emitir. En la comunicación pública se evita el tono corporativo vacío y no se admite responsabilidad antes de conocer la causa; un buen comunicado contiene hechos, fechas e instrucciones concretas, no frases que valdrían para cualquier organización.</p>"}], "acts": [{"n": "5.1", "t": "Alerta temperá", "ca": "CA5.1 · Procedimiento y plazos (2 h)", "obj": "Definir cómo y en qué plazos se notifica cada incidente.", "tools": ["Plantillas INCIBE-CERT / LUCÍA", "MailHog / Mailpit", "NIS2 · RGPD · ENS"], "steps": ["Clasificar qué incidentes exigen notificación inmediata y a quién.", "Construir la <b>tabla de disparadores y plazos</b>, verificando cada plazo en la fuente; imprimirla y colgarla en el aula.", "Redactar la plantilla de aviso de 10 líneas y enviarla al buzón MailHog."], "code": {"who": "siem · buzón de correo de laboratorio", "lines": "sudo <span class=\"a\">docker</span> run -d -p 8025:8025 -p 1025:1025 mailhog/mailhog\n<span class=\"c\"># Buzón web: http://172.21.10.10:8025   ·   SMTP: 172.21.10.10:1025</span>"}, "deliver": "Procedimiento de notificación + tabla de plazos verificada + ejemplo de aviso.", "amp": "Tabla comparativa de plazos: NIS2 (24 h / 72 h) vs RGPD (72 h a la AEPD).", "ia": {"ruta": ["La IA propone la tabla de disparadores y plazos; cada plazo se verifica en la fuente y la tabla se cuelga en el aula.", "El resto del curso los plazos se miran en la tabla: no se vuelven a preguntar a la IA.", "Plantilla de aviso de diez líneas: qué ha pasado, cuándo se detectó, qué está afectado, qué se hace, qué necesito de ti, cuándo vuelvo a informar."], "risk": "Plazo alucinado: «72 horas hábiles», o una norma derogada. Es el dato que la IA falla con más frecuencia.", "ctrl": "Lo que tiene consecuencias legales se verifica en la fuente primaria, siempre."}}, {"n": "5.2", "t": "Canles internas", "ca": "CA5.2 · Notificación interna (2 h)", "obj": "Comunicar internamente y escalar según la gravedad.", "tools": ["MailHog", "Flujo de escalado (UD4.3)", "Parte de incidente interno"], "steps": ["Notificar un incidente medio/alto siguiendo el flujo: analista → responsable → dirección.", "Redactar el parte interno (qué, impacto, medidas, decisión requerida).", "Simular el escalado al subir la gravedad; registrar comunicaciones."], "deliver": "Registro de comunicaciones internas + informe de escalado.", "amp": "Plantilla de comunicación de crisis y un canal «fuera de banda» por si el correo corporativo está comprometido.", "ia": {"ruta": ["Pedir cuatro versiones del mismo aviso <b>sin cambiar un solo hecho</b>: técnico, responsable de TI, gerencia y plantilla.", "Comparar qué se pierde en cada traducción y si algo importante desapareció al simplificar. Esa comparación es la actividad.", "Enviar las versiones al buzón MailHog siguiendo el flujo de escalado de 4.3."], "prompts": [{"who": "prompt · el mismo incidente, cuatro audiencias", "lines": "Te doy los hechos de un incidente [pegar]. Redacta cuatro versiones del mismo\naviso, sin cambiar ni un hecho:\n1. Para el técnico de sistemas (que tiene que actuar ya) — máx. 8 líneas\n2. Para el responsable de TI — máx. 10 líneas, con impacto y decisiones pendientes\n3. Para gerencia — máx. 6 líneas, sin jerga, con coste y riesgo legal\n4. Para la plantilla — máx. 5 líneas, qué deben hacer y qué no\nEn ninguna versión especules sobre causas ni sobre responsables."}], "risk": "Al simplificar para gerencia desaparece el dato que motiva la decisión que se les pide.", "ctrl": "La versión para gerencia se valida contra la técnica: cada decisión solicitada debe tener su hecho de respaldo.", "labId": 5}}, {"n": "5.3", "t": "Informes que protexen", "ca": "CA5.3 · Notificación a autoridades (2 h)", "obj": "Notificar a terceros con la documentación y el canal correctos.", "tools": ["INCIBE-CERT", "CCN-CERT (LUCÍA)", "CSIRT.gal", "AEPD", "GnuPG · TLP", "IODEF / STIX"], "steps": ["Determinar el organismo competente según entidad e incidente.", "Rellenar el informe estandarizado (identificación, impacto, IOC, medidas).", "Cifrar y enviar el aviso (a MailHog) aplicando TLP y confidencialidad.", "Registrar la comunicación externa y el seguimiento."], "deliver": "Informe estandarizado + registro de comunicaciones externas + justificación del organismo.", "amp": "Comparar una notificación NIS2 (a la autoridad) frente a una RGPD (a la AEPD y a los afectados).", "ia": {"ruta": ["Borrador del informe estandarizado con la IA, sobre la plantilla del organismo competente.", "<b>Filtro de confidencialidad</b> antes de cifrar y enviar: nombres, terceros, detalles reproducibles, especulación sobre autoría.", "La IA interpreta al funcionario que responde con un requerimiento de ampliación."], "risk": "Datos reales pegados en el chat para que la IA redacte mejor: la brecha se amplía durante la respuesta a la brecha.", "ctrl": "Doble redacción con marcadores [N] afectados, [SERVICIO], [FECHA]. Los datos reales entran en local y al final, nunca al revés."}}, {"n": "5.4", "t": "Análise de impacto", "ca": "CA5.4 · Notificación a afectados (3 h)", "obj": "Evaluar el impacto y comunicar a los afectados adecuadamente.", "tools": ["Datos del SIEM / registro", "Matriz de impacto", "Plantillas RGPD"], "steps": ["Evaluar el impacto sobre sistemas, datos y servicios; estimar alcance.", "Priorizar incidentes/afectados por gravedad e impacto.", "Redactar la comunicación formal a los afectados (clara, honesta, con medidas) y enviarla al buzón."], "deliver": "Informe de análisis de impacto + lista priorizada + comunicación a afectados.", "amp": "Dos versiones de la comunicación (técnica para proveedores, sencilla para clientes) y evaluar cuál cumple el RGPD.", "ia": {"ruta": ["La IA propone la matriz de impacto y una priorización; el alumnado la ajusta al caso y justifica cada cambio.", "El entregable lleva las dos versiones en paralelo: la de la IA y la corregida.", "Las cifras de alcance salen del SIEM y del registro, nunca de la estimación de la IA."], "risk": "Cifras de alcance inventadas que acaban dentro de una comunicación formal a los afectados.", "ctrl": "Todo número de la comunicación apunta a la consulta del SIEM o al campo del registro que lo respalda."}}, {"n": "5.5", "t": "Leccións aprendidas e mellora", "ca": "CA5.5 · Medios y mejora (3 h)", "obj": "Cerrar la gestión comunicativa y mejorar el proceso.", "tools": ["Plantilla de comunicado / portavocía", "BookStack / Moodle", "Retrospectiva"], "steps": ["Decidir si procede informar a medios y redactar, si aplica, un comunicado medido.", "Informe final de lecciones sobre la comunicación (qué funcionó, tiempos).", "Plan de mejora de los procedimientos; archivar en la base de conocimiento."], "deliver": "Informe final de lecciones + plan de mejora de notificación + (si procede) comunicado público.", "amp": "Simulacro de rueda de prensa / preguntas difíciles; analizar un caso real de gestión de una brecha.", "ia": {"ruta": ["La IA interpreta a un periodista incisivo: cuántos afectados, por qué no se dijo antes, si van a pagar. Tres rondas, la segunda sin preparación previa.", "<b>Prueba de la frase concreta</b>: se subraya todo lo que podría aparecer en el comunicado de cualquier otra empresa, y se elimina.", "Informe final de lecciones sobre la comunicación y plan de mejora."], "risk": "Comunicado con tono corporativo vacío, o que admite negligencia antes de conocer la causa.", "ctrl": "Tres lecturas con tres preguntas distintas: ¿hay algún hecho no confirmado?, ¿alguna frase admite culpa sin base?, ¿se entiende sin saber informática?"}}], "tareas": {"items": [{"n": "5.1", "t": "Alerta temperá", "peso": "—", "en": "Construid la tabla de disparadores de notificación (qué incidente, a quién, en qué plazo, verificando los plazos en la fuente) y una plantilla de aviso de 10 líneas.", "ent": "PDF con la tabla de plazos verificada y un ejemplo de aviso."}, {"n": "5.2", "t": "Canles internas", "peso": "—", "en": "Redactad cuatro versiones del mismo aviso, sin cambiar ningún hecho: técnico, responsable de TI, gerencia y plantilla; analizad qué se pierde en cada traducción.", "ent": "PDF con las cuatro versiones + análisis."}, {"n": "5.3", "t": "Informes que protexen", "peso": "—", "en": "Redactad la notificación externa al organismo competente (INCIBE-CERT / AEPD), con filtro de confidencialidad, y responded a un requerimiento de ampliación.", "ent": "PDF con las notificaciones y la respuesta."}, {"n": "5.4", "t": "Análise de impacto", "peso": "—", "en": "Elaborad una matriz de impacto × urgencia y una priorización; comparad la propuesta de la IA con vuestra versión corregida y justificad los cambios.", "ent": "PDF con las dos versiones en paralelo."}, {"n": "5.5", "t": "Leccións aprendidas e mellora", "peso": "—", "en": "Redactad el informe de lecciones aprendidas y, si procede, un comunicado público; incluid un simulacro de rueda de prensa.", "ent": "PDF con el informe, el comunicado y el anexo de la rueda de prensa."}]}}], "labtasks": {"1": {"t": "Laboratorio integrado · Normativa del puesto y detección de alucinaciones normativas", "escenario": "Como responsable de seguridad de TecnoMariña S.L., elaboras la Normativa de Protección del Puesto de Trabajo. Usas un LLM comercial para un primer borrador exhaustivo (autenticación, teletrabajo, bloqueo de pantalla, uso de IA generativa) y auditas cada control frente al ENS (RD 311/2022), detectando y corrigiendo las alucinaciones normativas.", "pasos": ["<b>Generación inicial.</b> Pedir a la IA la política de puesto exigiendo referencias expresas a artículos del ENS y a ISO/IEC 27002.", "<b>Auditoría de afirmaciones.</b> Localizar cada cita legal generada y contrastarla en el BOE.", "<b>Tratamiento de discrepancias.</b> Toda referencia inexistente se tacha y se sustituye por el marco real (p. ej. medidas [op.acc] del ENS).", "<b>Cláusula de IA.</b> Redactar la norma que prohíbe subir datos confidenciales o código municipal a plataformas de IA públicas.", "<b>Entrega.</b> Normativa final corregida + bitácora de prompts con las alucinaciones descartadas."], "entregable": "Normativa del puesto corregida + tabla de trazabilidad + bitácora de prompts."}, "2": {"t": "Laboratorio integrado · Triaje en Wazuh y mitigación de prompt injection en logs", "escenario": "Desde kali se lanza tráfico web hacia srvweb con una carga que intenta engañar al analista mediante instrucciones inyectadas en las cabeceras HTTP. El alumnado exporta las alertas de Wazuh, las somete a triaje asistido por IA, detecta la manipulación y crea una regla de detección.", "pasos": ["<b>Lanzamiento.</b> Desde kali, petición con la cabecera <code>User-Agent</code> envenenada (ver prompt de la capa IA).", "<b>Extracción.</b> Exportar desde Wazuh los eventos JSON del servidor web. <em>Nota: DVWA corre en contenedor; el log de Apache queda dentro, así que hay que montarlo o configurar el agente para leerlo, o el evento no llega a Wazuh.</em>", "<b>Comprobar la vulnerabilidad.</b> Con el prompt básico «clasifica estas alertas», ver cómo el LLM obedece la orden inyectada y descarta la alerta.", "<b>Aislamiento de contexto.</b> Rediseñar el prompt delimitando los datos y prohibiendo ejecutar órdenes contenidas en ellos.", "<b>Regla de detección.</b> Crear en <code>local_rules.xml</code> una regla que alerte cuando un <code>User-Agent</code> contenga «IGNORA» o «INSTRUCCIONES»."], "entregable": "Ficha del incidente + regla local de Wazuh + bitácora con los dos triajes (vulnerable y mitigado)."}, "3": {"t": "Laboratorio integrado · Cadena de custodia (RFC 3227) y desofuscación con IA local", "escenario": "Un atacante ha ejecutado un comando ofuscado en PowerShell en win10. Siguiendo el RFC 3227, se extrae la evidencia, se mantiene la cadena de custodia sin exponer datos a la nube y se analiza el código con un LLM local (Ollama) para mapearlo a MITRE ATT&CK.", "pasos": ["<b>Preservación (evidencia roja).</b> Extraer el script y calcular su huella antes y después del análisis con <code>Get-FileHash -Algorithm SHA256</code>. Completar la hoja de custodia.", "<b>Decodificación manual.</b> Si usa Base64/Unicode, obtener el texto claro en CyberChef, en local.", "<b>Análisis asistido local.</b> Suministrar el extracto a Ollama y pedir acciones línea a línea, claves de registro y técnicas ATT&CK.", "<b>Verificación de artefactos.</b> Comprobar en win10 si los ficheros o entradas de registro señalados por la IA realmente se crearon.", "<b>Entrega.</b> Informe pericial con hoja de custodia firmada, técnicas MITRE confirmadas y bitácora de IA local."], "entregable": "Informe forense pericial + hoja de custodia + bitácora de IA local."}, "4": {"t": "Laboratorio integrado · Firewall, playbook ante ransomware y resiliencia", "escenario": "Sobre la segmentación con nftables que has diseñado, desarrollas un playbook técnico ante ransomware (NIST SP 800-61) para TecnoMariña S.L., configuras en srvweb copias 3-2-1 con Restic, simulas un cifrado y mides experimentalmente el RTO y el RPO.", "pasos": ["<b>Generación con IA.</b> Pedir el esqueleto del playbook en 6 fases, etiquetando las órdenes con <code>[VERIFICAR]</code>.", "<b>Parametrización local.</b> Sustituir los marcadores por comandos y rutas reales del laboratorio (segmento 172.21.10.0/24).", "<b>Despliegue de copias.</b> <code>restic init</code> y <code>restic backup /var/www/html /etc/apache2</code>.", "<b>Simulación y restauración.</b> Alterar <code>/var/www/html</code>, cronometrar <code>restic restore latest</code> y calcular el RTO.", "<b>Comprobación FIM.</b> Validar con el FIM de Wazuh que el árbol de directorios vuelve a coincidir con la línea base."], "entregable": "Playbook validado por ejecución ciega + informe de RTO/RPO + evidencia FIM."}, "5": {"t": "Laboratorio integrado · Notificación de brecha y gestión comunicativa de crisis", "escenario": "Tras una fuga de datos personales en el portal municipal, se activan los procedimientos de notificación según el RGPD (72 h). Se usa la IA para adaptar el incidente a cuatro registros comunicativos con el protocolo de doble redacción y se realiza un simulacro de rueda de prensa.", "pasos": ["<b>Doble redacción.</b> Escribir el informe técnico con comodines (<code>[NUM_AFECTADOS]</code>, <code>[TIPO_DATOS]</code>) antes de pasarlo a la IA.", "<b>Adaptación multi-audiencia.</b> Pedir a la IA las cuatro versiones: técnica, gestión (TI), dirección y ciudadanía.", "<b>Desanonimización y prueba SMTP.</b> Completar los datos reales en local y emitir los avisos al SMTP de MailHog (172.21.10.10:1025).", "<b>Rueda de prensa.</b> El portavoz responde a tres rondas de preguntas incisivas formuladas por la IA como periodista.", "<b>Entrega.</b> Formularios oficiales cumplimentados + registro de comunicaciones."], "entregable": "Notificación formal + protocolo de doble redacción + registro de comunicaciones."}}, "resumenes": {"ud1": {"teoria": ["Tríada CIA más autenticación, autorización, trazabilidad y no repudio; amenaza, vulnerabilidad y riesgo; Zero Trust y defensa en profundidad.", "Quién es quién: INCIBE e INCIBE-CERT, CCN-CERT, OSI, AEPD y CSIRT.gal; marcos ENS, ISO/IEC 27000 y CIS Controls; RGPD y NIS2.", "Actores (ciberdelincuencia, hacktivismo, APT, ciberterrorismo), tendencias (RaaS, doble extorsión, cadena de suministro, fraude BEC, IA) y familias de malware.", "Phishing y sus variantes (spear-phishing, smishing, vishing, QRishing), spoofing, pretexting, baiting, tailgating y fraude del CEO.", "Política del puesto: actualizaciones, USB, almacenamiento, antimalware, borrado seguro, contraseñas y MFA, copias, correo, teletrabajo y BYOD, mesa limpia y uso de IA generativa.", "Plan por perfiles con objetivos SMART e indicadores; auditoría interna con listas de comprobación y ciclo PDCA."], "ca": [["CA1.1", "Principios generales de la organización en ciberseguridad", "LC", "20", []], ["CA1.2", "Normativa de protección del puesto de trabajo", "LC", "20", ["1.7", "1.8"]], ["CA1.3", "Plan de concienciación para la plantilla", "TO", "20", ["1.5"]], ["CA1.4", "Materiales para las acciones de concienciación", "LC", "20", ["1.6"]], ["CA1.5", "Auditoría de cumplimiento del plan", "TO", "20", []]]}, "ud2": {"teoria": ["Clasificar para priorizar: taxonomía de la Guía Nacional de Notificación, ENISA / eCSIRT.net y prioridad.", "Formatos (Syslog, CEF, LEEF, JSON), eventos clave de Windows (4624, 4625, 4672, 4688), logs de Linux y Sysmon; hora sincronizada e integridad de los registros.", "Detección por firmas y por anomalías; NIDS (Suricata, Snort, Zeek), HIDS (OSSEC / Wazuh), WAF y EDR/XDR.", "Qué hace un SIEM (parsear, normalizar, enriquecer, correlar, alertar), productos del mercado y triaje en el SOC.", "Wazuh con agentes, reglas de Suricata y búsquedas SPL en Splunk.", "Elasticsearch, Logstash, Beats y Kibana; KQL frente a SPL; Security Onion.", "OSINT solo sobre identidades ficticias; clasificar, valorar y dar seguimiento al incidente en TheHive."], "ca": [["CA2.1", "Taxonomía de incidentes de la organización", "LC", "20", ["2.1", "2.2"]], ["CA2.2", "Controles y herramientas de monitorización, detección y alerta", "LC", "20", ["2.3", "2.4", "2.5"]], ["CA2.3", "Detección de incidentes de seguridad física", "TO", "20", []], ["CA2.4", "Detección mediante investigación en fuentes abiertas (OSINT)", "TO", "20", []], ["CA2.5", "Clasificación, valoración, documentación y seguimiento", "TO", "20", []]]}, "ud3": {"teoria": ["Requisitos de la evidencia (RFC 3227, ISO/IEC 27037, UNE 71505/71506), orden de volatilidad y adquisición en caliente o en frío.", "Copia bit a bit, hash antes y después, almacenamiento seguro y registro de cada paso.", "Disco (Autopsy / Sleuth Kit), memoria (Volatility 3), malware, red y correo (SPF / DKIM / DMARC).", "Indicadores de compromiso, MITRE ATT&amp;CK (tácticas y técnicas), Cyber Kill Chain y Diamond Model.", "STIX/TAXII, MISP, protocolo TLP, REYES y LUCÍA; contener sin destruir la evidencia."], "ca": [["CA3.1", "Compilación y almacenamiento seguro de evidencias", "LC", "20", []], ["CA3.2", "Análisis de evidencias", "TO", "20", ["3.1", "3.2"]], ["CA3.3", "Investigación del incidente", "TO", "20", ["3.1", "3.2"]], ["CA3.4", "Intercambio de información con proveedores u organismos", "LC", "20", []], ["CA3.5", "Primeras medidas de contención", "TO", "20", []]]}, "ud4": {"teoria": ["Fases según NIST SP 800-61: preparación, detección, contención, erradicación, recuperación y actuaciones post-incidente.", "Segmentación y DMZ, diseño del ruleset e implementación en nftables (tablas, cadenas, políticas por defecto, log, NAT / DNAT).", "Playbooks con responsable, tiempo objetivo y criterio de salida; matriz de severidad, árbol de escalado, plazos legales y acciones prohibidas.", "Copias 3-2-1 e inmutables, probadas restaurando; RTO y RPO; control de integridad de ficheros (FIM).", "ÁNGELES, LUCÍA, REYES, CARMEN / CLAUDIA; gestión de casos con FIR o TheHive; SOAR."], "ca": [["CA4.1", "Procedimientos de actuación ante los incidentes habituales", "LC", "15", ["4.1", "4.2"]], ["CA4.2", "Respuestas ciberresilientes y cooperación con terceros", "LC", "15", ["1.1", "1.2", "1.3", "1.4", "4.4"]], ["CA4.3", "Flujo de toma de decisiones y escalado", "TO", "20", []], ["CA4.4", "Restablecimiento de los servicios afectados", "LC", "20", []], ["CA4.5", "Documentación y lecciones aprendidas", "TO", "20", ["4.3"]], ["CA4.6", "Seguimiento para evitar que se repita", "TO", "10", []]]}, "ud5": {"teoria": ["Guía Nacional de Notificación: ventanilla única, CSIRT de referencia (INCIBE-CERT, CCN-CERT), autoridad competente, AEPD y CNPIC.", "Nivel de peligrosidad e impacto, qué es de notificación obligatoria y notificaciones inicial, intermedia y final.", "RGPD: brecha a la AEPD en 72 h y a los afectados sin dilación. NIS2: alerta temprana en 24 h, notificación en 72 h e informe final en un mes.", "Un mismo incidente contado a técnico, TI, dirección, plantilla y ciudadanía; doble redacción con marcadores y revisión cruzada."], "ca": [["CA5.1", "Procedimiento de notificación en los tiempos adecuados", "LC", "20", ["5.1"]], ["CA5.2", "Notificación al personal interno que decide", "TO", "20", ["5.2"]], ["CA5.3", "Notificación a las autoridades competentes", "LC", "20", ["5.3"]], ["CA5.4", "Notificación formal a las partes afectadas", "TO", "20", ["5.4"]], ["CA5.5", "Notificación a los medios de comunicación", "LC", "20", ["5.5"]]]}}, "detalle": {"ud1": [{"h": "Principios: la tríada CIA y el resto de propiedades", "html": "<p>Toda la ciberseguridad se ordena alrededor de tres propiedades de la información, la <b>tríada CIA</b>: <b>confidencialidad</b> (solo accede quien está autorizado), <b>integridad</b> (nadie la altera sin permiso) y <b>disponibilidad</b> (está cuando se necesita). Un incidente es, por definición, cualquier suceso que afecta a una de las tres. A ellas se suman la <b>autenticación</b> (probar quién eres), la <b>autorización</b> (qué puedes hacer), la <b>trazabilidad</b> (registrar quién hizo qué) y el <b>no repudio</b> (no poder negar lo hecho).</p><p>Conviene fijar pronto el vocabulario que se usa el resto del curso: una <b>amenaza</b> es un peligro potencial, una <b>vulnerabilidad</b> es la debilidad que la amenaza aprovecha, el <b>riesgo</b> es la combinación de probabilidad e impacto, y el <b>incidente</b> es la amenaza ya materializada. Dos ideas rectoras: <b>defensa en profundidad</b> (varias capas de control, no una sola) y <b>Zero Trust</b> (no confiar por defecto en nada, ni dentro de la propia red).</p>"}, {"h": "Marco normativo y organismos de referencia", "html": "<p>En España el alumnado debe saber a quién acudir. <b>INCIBE</b> (y su <b>INCIBE-CERT</b>) es el CERT de referencia para empresas y ciudadanía; el <b>CCN-CERT</b> cubre el sector público; la <b>OSI</b> orienta a la ciudadanía; la <b>AEPD</b> es la autoridad de protección de datos; y en Galicia existe el <b>CSIRT.gal</b>. Como marcos de control se manejan el <b>ENS</b> (Esquema Nacional de Seguridad, RD 311/2022, obligatorio en el sector público), la familia <b>ISO/IEC 27000</b> y los <b>CIS Controls</b>. En el plano legal, el <b>RGPD</b> rige los datos personales y la <b>Directiva NIS2</b> la seguridad de servicios esenciales.</p>"}, {"h": "Panorama de amenazas y tendencias", "html": "<p>Los <b>actores</b> van desde la ciberdelincuencia con ánimo de lucro hasta el <b>hacktivismo</b>, el <b>ciberespionaje</b> y las <b>APT</b> (amenazas persistentes avanzadas, dirigidas y sigilosas), el ciberterrorismo y las campañas de desinformación. Entre las <b>tendencias</b> actuales destacan el <b>ransomware como servicio (RaaS)</b> y la <b>doble extorsión</b> (cifrar y además amenazar con publicar), los ataques a la <b>cadena de suministro</b> y el <b>fraude del CEO/BEC</b>. El <b>malware</b> se clasifica en virus, gusano, troyano, spyware, adware, rootkit y ransomware, entre otros.</p><p><b>Giro 2026 — la IA como multiplicador:</b> las mismas familias de amenazas, pero más rápidas, baratas y creíbles. El phishing generado por IA logra muchos más clics y ya está detrás de buena parte del fraude BEC; los <b>deepfakes</b> de voz y vídeo permiten suplantar a un directivo para autorizar pagos; el <b>ransomware</b> se vuelve autónomo (el agente elige objetivo, exfiltra y cifra) con doble y triple extorsión; y un agente puede convertir un <b>CVE</b> público en un exploit. La idea de fondo: la IA <b>comprime el ciclo de ataque</b> y reduce la barrera de entrada al cibercrimen. El desarrollo con cifras y casos está en «Trabajar con IA → Amenazas potenciadas por IA».</p>"}, {"h": "Ingeniería social: el eslabón humano", "html": "<p>La mayoría de los incidentes empiezan por una persona, no por una máquina. El <b>phishing</b> (y sus variantes <b>spear-phishing</b> dirigido, <b>smishing</b> por SMS, <b>vishing</b> por voz y <b>QRishing</b> por código QR) busca que la víctima entregue credenciales o ejecute algo. Se combinan con <b>spoofing</b> (suplantación de remitente o dominio), <b>pretexting</b> (una excusa creíble), <b>baiting</b> (un cebo, como un USB abandonado) y técnicas físicas como el <b>tailgating</b>. La contramedida no es técnica sino de <b>concienciación</b>: por eso la unidad culmina en un plan de formación.</p>"}, {"h": "Protección del puesto de trabajo", "html": "<p>La normativa del puesto traduce los principios a reglas del día a día: <b>actualizaciones</b> al día, <b>control de dispositivos extraíbles</b> (registro de USB autorizados), política de <b>almacenamiento</b> y de <b>copias de seguridad</b>, <b>antimalware</b>, <b>borrado seguro</b> y <b>clasificación de la información</b> (confidencial / interna / pública). En accesos: <b>contraseñas</b> robustas con gestor, <b>doble factor (MFA)</b> y control de acceso por roles. Y las prácticas cotidianas: <b>correo</b> con cuidado ante adjuntos y enlaces, <b>teletrabajo y BYOD</b> con VPN, <b>mesa limpia</b> y una cláusula explícita de <b>uso de IA generativa</b>.</p>"}, {"h": "Plan de concienciación y auditoría", "html": "<p>Un plan de concienciación eficaz define <b>públicos</b> diferenciados (no es igual el personal técnico que la administración o la dirección), <b>objetivos SMART</b>, acciones (charlas, boletines, pósters, simulacros de phishing) e <b>indicadores (KPIs)</b> para medir si funciona. La <b>auditoría interna</b> cierra el ciclo: con una lista de comprobación se verifica el cumplimiento de la normativa, se detectan desviaciones y se proponen mejoras, en un ciclo de mejora continua <b>PDCA</b>.</p>"}]}, "publicadas": ["ud1"]};</script>

 var rows=L.vms.map(function(v){return '<tr><td class="mono">'+v.n+'</td><td>'+v.rol+'</td><td>'+v.so+'</td><td class="num">'+v.ram+'</td><td class="mono ip">'+v.ip+'</td></tr>';}).join('');
 var prov=L.fuentes.map(function(f){return '<tr><td class="mono">'+f[0]+'</td><td>'+f[1]+'</td></tr>';}).join('');
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:var(--accent)">LAB</span><h2>El laboratorio</h2></div>'
 +'<p class="sec-meta">Entorno común · dos escenarios, un mismo plan de IPs</p>'
 +'<p class="lead">Todo el tráfico entre víctimas y atacante vive en una <b>red interna aislada</b> que no sale al exterior: se pueden lanzar ataques reales sin riesgo. El escenario se monta con <b>VirtualBox + Vagrant</b> sobre una <b>red interna aislada</b> <span class="mono ip">172.21.10.0/24</span> que no sale al exterior, así que se puede reproducir en cualquier equipo.</p>'

 function box(x,y,w,h,col,lines){var cx=x+w/2;

 var diag='<div class="diagram" role="img" aria-label="Escenario de red del laboratorio MP5021: anfitrion, SIEM, victimas srvweb y win10, atacante kali, sobre la red interna aislada 172.21.10.0/24">'

 +box(30,120,220,96,'var(--ud1)',['SIEM · 172.21.10.10','Debian 12 · puerta de enlace','Wazuh (SIEM/XDR) · Suricata','TheHive · MailHog'])
 +box(300,120,210,96,'var(--ud2)',['SRV-WEB · 172.21.10.30','Debian 12 · LAMP','DVWA / OWASP Juice Shop','Víctima · portal municipal'])
 +box(560,120,210,96,'var(--ud5)',['WIN10 · 172.21.10.20','Windows 10/11 Eval','Sysmon + agente Wazuh','Víctima · puesto de usuario'])
 +'<rect x="30" y="256" width="740" height="46" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>'

 s.innerHTML='<div class="sec-head"><span class="tag" style="background:var(--accent)">ESC</span><h2>Escenario detallado</h2></div>'
 +'<p class="sec-meta">Qué hay en cada máquina, para qué sirve y cómo encajan</p>'
 +'<p class="lead">Cuatro máquinas recrean la red de <b>TecnoMariña S.L.</b> (presta servicios TIC a un ayuntamiento), todas colgadas de una <b>red interna aislada</b> de VirtualBox llamada <span class="mono">labcyber</span> en el rango <span class="mono ip">172.21.10.0/24</span>. No hay salida a Internet ni modo bridge: al panel del SIEM se entra por <b>reenvío de puertos NAT</b> (<span class="mono">8443</span> del anfitrión → <span class="mono">443</span> de la VM). El ciclo de fondo es siempre el mismo: <b>kali ataca → la víctima (srvweb o win10) genera eventos → siem los recoge, correla y alerta</b>.</p>'
 +diag
 +'<h3>1 · <span class="mono">siem</span> — el cerebro defensivo</h3>'
 +'<div class="chips"><span class="chip">Debian 12</span><span class="chip">4–6 GB RAM</span><span class="chip">172.21.10.10</span></div>'
 +'<p>Es el <b>centro de operaciones (SOC)</b> del laboratorio y, además, la <b>puerta de enlace</b> del segmento: reenvía el tráfico para que Suricata lo vea.</p>'
 +'<ul>'
 +'<li><b>Wazuh</b> (indexer + manager + dashboard, todo en una VM): el <b>SIEM/XDR</b>. Recibe los logs de las víctimas a través de sus agentes y los convierte en alertas.</li>'
 +'<li><b>Suricata</b>: <b>IDS de red (NIDS)</b>. Vigila el tráfico del segmento y detecta escaneos, fuerza bruta, etc. Sus alertas (<span class="mono">eve.json</span>) se integran en Wazuh.</li>'
 +'<li><b>TheHive</b>: gestión de casos; convierte alertas sueltas en <b>incidentes con ficha, gravedad, responsable y seguimiento</b> (UD2).</li>'
 +'<li><b>MailHog</b>: buzón de correo de laboratorio para recibir avisos y notificaciones <b>sin salir a Internet</b> (phishing controlado de UD1, notificación de brecha de UD5).</li>'
 +'</ul>'
 +'<p>Acceso al panel desde el anfitrión: <span class="mono">https://localhost:8443</span>.</p>'
 +'<h3>2 · <span class="mono">srvweb</span> — víctima servidor web</h3>'
 +'<div class="chips"><span class="chip">Debian 12</span><span class="chip">1,5–2 GB RAM</span><span class="chip">172.21.10.30</span></div>'
 +'<p>Representa el <b>portal del ayuntamiento</b>. Pila <b>LAMP</b> (Apache + MariaDB + PHP) con <b>DVWA / OWASP Juice Shop</b> (en contenedor): aplicaciones <b>vulnerables a propósito</b> para practicar ataques web (inyección SQL, XSS, subida de ficheros). Un <b>agente Wazuh</b> envía los logs de Apache al SIEM. Es la máquina que recibe los ataques y deja rastro en los logs.</p>'
 +'<h3>3 · <span class="mono">win10</span> — víctima puesto de usuario</h3>'
 +'<div class="chips"><span class="chip">Windows 10/11 Eval</span><span class="chip">3–4 GB RAM</span><span class="chip">172.21.10.20</span></div>'
 +'<p>Es el PC de un empleado. Lleva <b>Sysmon</b> (registra con detalle creación de procesos, conexiones de red y cambios en el registro: visibilidad fina del endpoint) y <b>agente Wazuh</b> que envía esos eventos al SIEM. Sirve para malware, procesos sospechosos y <b>análisis forense</b> de memoria y disco. Se arranca solo cuando hace falta, porque consume bastante RAM.</p>'
 +'<h3>4 · <span class="mono">kali</span> — atacante y estación forense</h3>'
 +'<div class="chips"><span class="chip">Kali Linux rolling</span><span class="chip">3–4 GB RAM</span><span class="chip">172.21.10.100</span></div>'
 +'<p>Doble papel. En UD1–UD2 es el <b>atacante</b> que genera el ruido a detectar (nmap, hydra, hping3, sqlmap, nikto, diccionario rockyou); en UD3 es la <b>estación forense</b> donde se analizan las evidencias (Autopsy, Volatility, YARA, CyberChef).</p>'
 +'<div class="note">'+ICON.info+'<div><b>Comprobación de aislamiento:</b> desde kali, <span class="mono">ping 172.21.10.10</span> debe llegar al SIEM, pero <span class="mono">ping 8.8.8.8</span> <b>debe fallar</b> — la red no sale a Internet.</div></div>'
 +'<h3>Ejemplo de principio a fin · fuerza bruta SSH</h3>'
 +'<p class="lead">El flujo típico de la actividad 2.2, visto desde el SIEM:</p>'
 +codeBlock({who:'kali · fuerza bruta SSH contra srvweb',lines:'<span class="a">nmap</span> -sS -p- 172.21.10.30            <span class="c"># descubre puertos abiertos → lo ve Suricata</span>\n<span class="a">hydra</span> -l empleado -P rockyou.txt ssh://172.21.10.30  <span class="c"># prueba el diccionario contra SSH</span>'})
 +'<ol>'
 +'<li><b>kali</b> escanea y lanza la fuerza bruta contra el SSH de srvweb.</li>'
 +'<li><b>srvweb</b> acumula intentos de login fallidos; su <b>agente Wazuh</b> los reenvía al SIEM. A la vez, <b>Suricata</b> ve los paquetes al puerto 22 y dispara su alerta de red.</li>'
 +'<li>En el <b>panel de Wazuh</b> aparece la alerta de posible fuerza bruta, con la IP de origen (<span class="mono ip">172.21.10.100</span>, el kali).</li>'
 +'<li>El alumnado <b>clasifica el incidente, abre la ficha en TheHive</b> y decide la respuesta (bloquear la IP, deshabilitar la cuenta). En UD4 se automatiza con la <em>active response</em> de Wazuh.</li>'
 +'</ol>'
 +'<p class="amp"><b>Y a partir de aquí ·</b> el mismo ciclo se repite cambiando el ataque: web con sqlmap sobre DVWA, malware en win10 analizado con Sysmon y Volatility, inundación ICMP con hping3…</p>';
 return s;}

function iaSection(){var s=el('section');s.id='ia';s.setAttribute('data-ia','1');
 var flow=D.units.map(function(u){var m={ud1:['Produce','y el alumnado verifica'],ud2:['Propone','y el alumnado decide'],ud3:['Pregunta','y el alumnado investiga'],ud4:['Despeja','el papel en blanco, y el alumnado aterriza'],ud5:['Traduce','y el alumnado responde']}[u.id];return '<div class="st" style="--udc:'+u.color+'"><div class="u">'+u.tag+'</div><div class="v">'+m[0]+'</div><div class="d">'+m[1]+'</div></div>';}).join('');
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:var(--ia)">IA</span><h2>Trabajar con IA en el módulo</h2></div>'
 +'<p class="sec-meta">Reglas comunes · una sesión antes de la UD1</p>'
 +'<p class="lead">La IA cambia de papel en cada unidad. El criterio de evaluación no es <em>haber usado IA</em> sino <em>saber dónde falla</em>.</p>'
 +'<div class="flow">'+flow+'</div>'
 +'<h3>Semáforo de datos</h3><div class="sem">'
 +'<div class="v"><div class="l">Verde · público o inventado</div><p>Conceptos, casos de prensa, todo lo de TecnoMariña S.L. → IA en la nube sin restricción.</p></div>'
 +'<div class="a"><div class="l">Ámbar · laboratorio anonimizado</div><p>Logs y configuraciones con IP privadas y usuarios ficticios → IA en la nube, solo fragmentos.</p></div>'
 +'<div class="r"><div class="l">Rojo · evidencia, malware, datos personales</div><p>Todo lo que tenga cadena de custodia → solo IA local (Ollama, modelo 3B) o ninguna IA.</p></div></div>'
 +'<h3>Herramientas</h3><div class="chips"><span class="chip">Claude / ChatGPT / Gemini</span><span class="chip">Ollama (local)</span><span class="chip">NotebookLM</span><span class="chip">Mermaid</span><span class="chip">Canva</span><span class="chip">Whisper</span><span class="chip">MITRE ATT&amp;CK Navigator</span><span class="chip">Sigma</span><span class="chip">CyberChef</span></div>'
 +'<div class="note">'+ICON.info+'<div>La IA local es obligatoria desde la UD3. Con <b>16 GB y las VM levantadas, lo realista es un modelo de 3B</b> (<span class="mono">ollama run llama3.2:3b</span>).</div></div>'
 +'<h3>Bitácora de prompts</h3><p class="lead">Anexo de una página en todo trabajo con IA. Se integra en la lista de cotejo y en la tabla de observación. El criterio no es «ha usado IA» sino <b>«sabe dónde falla la IA»</b>.</p>'
 +'<div class="code"><div class="bar"><span class="who">anexo · bitácora de prompts</span><button class="copy" type="button">copiar</button></div><pre id="bitaPre"></pre></div>'
 +'<h3 id="amenazas-ia">Amenazas potenciadas por IA (2026)</h3>'+'<p class="lead">La IA no inventa ataques nuevos: <b>acelera</b> los de siempre y <b>comprime el ciclo de ataque</b> (reconocimiento → descubrimiento de la vulnerabilidad → explotación → movimiento lateral → exfiltración) hasta un ritmo que las defensas humanas no siguen. Por eso la prioridad se desplaza de «detectar más» a <b>verificar, decidir y remediar más rápido</b>, con control humano.</p>'+'<div class="tiles" style="grid-template-columns:repeat(3,1fr)">'+'<div class="tile" style="--udc:var(--ia)"><div class="k">94%</div><div class="d">de líderes creen que la IA redefinirá la ciberseguridad (WEF, Global Cybersecurity Outlook 2026)</div></div>'+'<div class="tile" style="--udc:var(--ia)"><div class="k">×4</div><div class="d">clics del phishing generado por IA frente al humano; 40% del fraude BEC ya lo genera IA (Huntress)</div></div>'+'<div class="tile" style="--udc:var(--ia)"><div class="k">~4,7 meses</div><div class="d">en que se duplica el horizonte de tareas cyber que la IA resuelve con 80% de fiabilidad (AI Security Institute, UK, feb 2026)</div></div>'+'</div>'+'<p>Las formas que más conviene explicar en el aula:</p><ul>'+'<li><b>Phishing con IA generativa</b> — correos impecables, multiidioma e hiperpersonalizados con datos de redes sociales. (UD1, UD2)</li>'+'<li><b>Deepfakes de voz y vídeo</b> — suplantación de directivos para autorizar pagos; el FBI lo señala como la amenaza de IA de más rápido crecimiento. (UD1)</li>'+'<li><b>Ransomware autónomo</b> — agentes que eligen objetivo, exfiltran y cifran, con doble y triple extorsión. (UD3, UD4)</li>'+'<li><b>Credenciales con agentes IA</b> — <em>password spraying</em> automatizado (una contraseña común contra muchas cuentas para esquivar el bloqueo). (UD1, UD2)</li>'+'<li><b>Weaponización de CVE</b> — un agente genera el exploit a partir de un boletín público de vulnerabilidad. (UD3)</li>'+'<li><b>Cadena de suministro y Shadow AI</b> — compromiso vía una dependencia de confianza; y uso interno no autorizado de IA que fuga datos. (UD2, UD4)</li>'+'</ul>'+''+'<div class="note warn">'+ICON.warn+'<div><b>Verificar al inicio de cada curso:</b> las cifras y los casos de este bloque corresponden a 2026 y envejecen rápido. Contrastar los datos en sus fuentes primarias (WEF, IBM X-Force, AISI) y actualizar antes de impartir.</div></div>'+'<div class="note">'+ICON.info+'<div><b>Encaje didáctico:</b> esto es el <em>porqué</em> de la capa de IA del módulo. Cada amenaza anterior tiene su reflejo en una unidad, y el alumnado aprende tanto a usar la IA como a reconocer dónde el atacante la usa contra él.</div></div>'+'<h3 id="jailbreaking">Jailbreaking de IA y prompt injection</h3>'+'<p class="lead">Un <b>jailbreak</b> es cualquier técnica que hace <b>fallar las barreras de seguridad (guardrails)</b> de un sistema de IA: el daño es el de la barrera que se saltó (violar la política del operador, obedecer a un usuario que no debería mandar, o ejecutar instrucciones maliciosas). Es la otra cara de la moneda: no es la IA atacando, es el <em>ataque a la propia IA</em>.</p>'+'<h4>Dos familias</h4><ul>'+'<li><b>Prompt injection directa</b> — el propio usuario escribe la trampa en su prompt («ignora las instrucciones anteriores y…») para ampliar sus permisos sobre el sistema.</li>'+'<li><b>Prompt injection indirecta</b> — la instrucción viaja <b>escondida en un contenido que la IA lee</b>: una página web, un documento o <b>un log</b>. Es exactamente el incidente estrella de la UD2, donde el alumnado envenena una cabecera que luego se pega en la IA de triaje.</li>'+'</ul>'+'<h4>Técnicas habituales</h4><ul>'+'<li><b>DAN (Do Anything Now)</b> — pedir a la IA que interprete a una IA sin restricciones.</li>'+'<li><b>Crescendo</b> — varios turnos que desplazan poco a poco el tema hacia lo prohibido, sin que ningún prompt suelto parezca malicioso.</li>'+'<li><b>Ingeniería social</b> — urgencia, halago o apelación a la autoridad para que el modelo se salte sus salvaguardas.</li>'+'<li><b>Ataques por codificación</b> — ocultar la orden en Base64, ROT13 o URL-encoding, que el modelo descodifica pero el filtro puede pasar por alto.</li>'+'<li><b>Role-play</b> — hacer que el modelo adopte un personaje «sin política de contenidos».</li>'+'</ul>'+'<h4>Defensas</h4><ul>'+'<li><b>Filtrado de entrada</b>: revisar el prompt en busca de patrones de jailbreak antes de que llegue al modelo.</li>'+'<li><b>Endurecer el <span class="mono">system prompt</span></b>: instruir al modelo para que resista los intentos de anulación y trate los datos como datos, no como órdenes.</li>'+'<li><b>Filtrado de salida</b>: comprobar la respuesta antes de devolverla.</li>'+'<li><b>Monitorización de comportamiento</b>: detectar patrones raros, como la escalada rápida entre turnos.</li>'+'<li><b>Actualización continua</b>: las barreras se revisan a medida que aparecen técnicas nuevas.</li>'+'</ul>'+'<div class="note">'+ICON.info+'<div><b>Idea clave:</b> ninguna medida basta por sí sola — se aplican <b>en capas (defensa en profundidad)</b> y es un <b>ciclo continuo</b> de ataque y mitigación. En este módulo se practica en la UD2 (inyección vía log) y se separa siempre <b>dato no confiable</b> de <b>instrucción</b> en el prompt. <span style="font-size:12px;color:var(--faint)">Fuente: Microsoft Learn — <em>Fundamentals of AI security · AI jailbreaks</em>.</span></div></div>';
 return s;}

function activityCard(a,color,uid){var d=el('details','act');d.id='act-'+a.n.replace('.','-');d.style.setProperty('--udc',color);
 if(!pubU(uid)){d.innerHTML='<summary><span class="anum">'+a.n+'</span><span class="stit"><span class="t">'+a.t+'</span><span class="ca">'+a.ca+'</span></span><span class="chev">'+ICON.chev+'</span></summary><div class="body"><div class="note">'+ICON.info+'<div>Contenido no publicado todav\u00eda; se desarrollar\u00e1 al trabajar esta unidad.</div></div></div>';return d;}
 var ia='';
 if(a.ia){ia+='<div class="ia"><div class="iah">'+ICON.ia+'Capa IA</div>';
  ia+='<span class="lbl" style="color:var(--ia)">Ruta de trabajo</span>'+list(a.ia.ruta);
  (a.ia.prompts||[]).forEach(function(p){ia+=codeBlock(p);});
  if(a.ia.risk)ia+='<div class="line risk"><b>Riesgo ·</b> '+a.ia.risk+'</div>';
  if(a.ia.ctrl)ia+='<div class="line ctrl"><b>Control ·</b> '+a.ia.ctrl+'</div>';
  if(a.ia.labId&&D.labtasks[a.ia.labId]){var L=D.labtasks[a.ia.labId];
   ia+='<div class="labia" style="margin-top:16px;border:1px dashed var(--border-strong);border-radius:9px;padding:2px 15px 14px;background:var(--surface-2)"><div class="lbl">Laboratorio integrado</div><h4>'+L.t+'</h4><p>'+L.escenario+'</p><div class="lbl">Pasos</div><ol>'+L.pasos.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol><div class="deliver"><b>Entregable ·</b> '+L.entregable+'</div></div>';}
  ia+='</div>';}
 var fixes='';
 var q='';
 var note=a.note?('<div class="note">'+ICON.info+'<div>'+a.note+'</div></div>'):'';
 d.innerHTML='<summary><span class="anum">'+a.n+'</span><span class="stit"><span class="t">'+a.t+'</span><span class="ca">'+a.ca+'</span></span><span class="chev">'+ICON.chev+'</span></summary>'
 +'<div class="body"><p>'+a.obj+'</p>'
 +'<span class="lbl">Entorno y herramientas</span><div class="chips">'+a.tools.map(function(t){return '<span class="chip">'+t+'</span>';}).join('')+'</div>'
 +'<span class="lbl">Tarea de aula (sin IA)</span>'+list(a.steps)
 +(a.code?codeBlock(a.code):'')
 +fixes
 +'<div class="deliver"><b>Entregable ·</b> '+a.deliver+'</div>'
 +'<p class="amp"><b>Ampliación ·</b> '+a.amp+'</p>'
 +(a.extra||'')
 +q+note+ia
 +''
 +'</div>';
 return d;}

function unitSection(u){var s=el('section');s.id=u.id;s.style.setProperty('--udc',u.color);
 var av=u.aviso?('<div class="note warn">'+ICON.warn+'<div>'+u.aviso+'</div></div>'):'';
 var teoria=u.teoria?('<span class="lbl">Teoría de la unidad</span>'+u.teoria.map(function(t,i){return '<h4 id="teo-'+u.id+'-'+(i+1)+'">'+t.h+'</h4>'+t.html;}).join('')):'';
 var tareas='';
 if(u.tareas){
  var ti=u.tareas.items.map(function(t){
   if(!pubU(u.id))return '<div class="tarea" id="'+tarId(u,t)+'" style="--udc:'+u.color+'"><div class="tnum">'+t.n+'</div><div class="tbody"><div class="tt">'+t.t+'</div><p class="ten" style="color:var(--faint)">Contenido no publicado todav\u00eda.</p></div></div>';
   var peso=(t.peso&&t.peso!=='—')?' <span class="tpeso">'+t.peso+'</span>':'';
   var ts='';
   return '<div class="tarea" id="'+tarId(u,t)+'"><div class="tnum">'+t.n+'</div><div class="tbody"><div class="tt">'+t.t+peso+'</div><p class="ten">'+t.en+'</p><div class="tent"><b>Entregable ·</b> '+t.ent+'</div>'+ts+'</div></div>';
  }).join('');
  var nota=u.tareas.nota?('<div class="note">'+ICON.info+'<div>'+u.tareas.nota+'</div></div>'):'';
  tareas='<span class="lbl" style="margin-top:30px">Tareas entregables ('+u.tareas.items.length+')</span>'+nota+'<div class="tareas">'+ti+'</div>';
 }
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:'+u.color+'">'+u.tag+'</span><h2>'+u.title+'</h2></div>'
 +'<p class="sec-meta">'+u.dur+' · '+u.peso+' · '+u.ra+' · Instrumentos '+u.inst+'</p>'
 +'<p class="lead">'+u.intro+'</p>'+av+teoria
 +'<span class="lbl" style="margin-top:26px">Actividades ('+u.acts.length+')</span><div class="acts"></div>'
 +tareas;
 var wrap=s.querySelector('.acts');u.acts.forEach(function(a){wrap.appendChild(activityCard(a,u.color,u.id));});
 return s;}

function tarId(u,t){return 'tar-'+u.id+'-'+t.n.replace('.','-');}
function detalleUnit(u){var B=(D.detalle||{})[u.id];if(!B)return null;if(D.role!=='profe'&&u.id!=='ud1')return null;
 var s=el('section','det');s.id='det-'+u.id;s.style.setProperty('--udc',u.color);
 var body=B.map(function(b,i){return '<h3 id="det-'+u.id+'-'+(i+1)+'">'+b.h+'</h3>'+b.html;}).join('');
 var prac='';var PR=(D.prac||{})[u.id];
 
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:'+u.color+'">'+u.tag+' · DET</span><h2>'+u.title+' — desarrollo</h2></div>'
 +'<p class="sec-meta">Teoría desarrollada de la unidad</p>'+body+prac;
 return s;}

function resumenUnit(u){var R=(D.resumenes||{})[u.id];if(!R)return null;
 var s=el('section','res');s.id='res-'+u.id;s.style.setProperty('--udc',u.color);
 var strip=function(h){return h.replace(/<[^>]+>/g,'');};
 var teo=(u.teoria||[]).map(function(t,i){return '<li><a href="#teo-'+u.id+'-'+(i+1)+'">'+t.h.replace(/^\d+\.\s*/,'')+'</a> — '+(R.teoria[i]||'')+'</li>';}).join('');
 var acts=u.acts.map(function(a){return '<tr><td><a href="#act-'+a.n.replace('.','-')+'">'+a.n+'</a></td><td>'+a.t+'</td><td class="num">'+a.ca+'</td><td>'+strip(a.deliver)+'</td></tr>';}).join('');
 var caDe={};R.ca.forEach(function(c){c[4].forEach(function(n){(caDe[n]=caDe[n]||[]).push(c[0]);});});
 var items=(u.tareas&&u.tareas.items)||[];
 var tars=items.map(function(t){var p=(t.peso&&t.peso!=='—')?t.peso:'—';return '<tr><td><a href="#'+tarId(u,t)+'">'+t.n+'</a></td><td>'+t.t+'</td><td class="num">'+p+'</td><td class="num">'+((caDe[t.n]||[]).join(', ')||'—')+'</td><td>'+strip(t.ent)+'</td></tr>';}).join('');
 var byN={};items.forEach(function(t){byN[t.n]=t;});
 var cas=R.ca.map(function(c){var l=c[4].map(function(n){return byN[n]?'<a href="#'+tarId(u,byN[n])+'">'+n+'</a>':n;}).join(' · ');return '<tr><td class="mono">'+c[0]+'</td><td>'+c[1]+'</td><td class="num">'+c[2]+'</td><td class="num">'+c[3]+' %</td><td>'+(l||'<span class="gap">solo con la actividad</span>')+'</td></tr>';}).join('');
 var claves='';
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:'+u.color+'">RES · '+u.tag+'</span><h2>Resumen de la '+u.tag+'</h2></div>'
 +'<p class="sec-meta">'+u.title+' · '+u.dur+' · '+u.peso+' · '+u.ra+' · '+u.inst+'</p>'
 +'<h3>Teoría a explicar</h3><ol class="teo">'+teo+'</ol>'
 +'<h3>Actividades de aula ('+u.acts.length+')</h3><div class="tbl-wrap"><table><thead><tr><th>Act.</th><th>Título</th><th>CA · horas</th><th>Producto</th></tr></thead><tbody>'+acts+'</tbody></table></div>'
 +(items.length?'<h3>Tareas de entrega ('+items.length+')</h3><div class="tbl-wrap"><table><thead><tr><th>Tarea</th><th>Título</th><th>Peso</th><th>CA</th><th>Entregable</th></tr></thead><tbody>'+tars+'</tbody></table></div>':'')
 +'<h3>Criterios de evaluación</h3><div class="tbl-wrap"><table><thead><tr><th>CA</th><th>Criterio</th><th>Inst.</th><th>Peso</th><th>Tareas que lo cubren</th></tr></thead><tbody>'+cas+'</tbody></table></div>'
 +claves;
 return s;}

function usoSection(){return el('div');}

function resumenSection(){return el('div');}

function evalSection(){var s=el('section');s.id='eval';
 var tiles=D.units.map(function(u){return '<div class="tile" style="--udc:'+u.color+'"><div class="k">'+u.tag+' · '+u.ra+'</div><div class="b">'+u.peso.replace(' %','%')+'</div><div class="d">'+u.inst+'</div></div>';}).join('');
 s.innerHTML='<div class="sec-head"><span class="tag" style="background:var(--accent)">EVAL</span><h2>Evaluación</h2></div>'
 +'<p class="sec-meta">Ponderación por unidad e instrumentos</p><div class="tiles">'+tiles+'</div>'
 +'<p class="lead">Instrumentos: <b>Lista de Cotexo (LC)</b> para la calidad del producto técnico y <b>Táboa de Observación (TO)</b> para el proceso en las VM. La <b>bitácora de prompts</b> es anexo obligatorio de todo trabajo con IA y se integra en ambos instrumentos.</p>';
 return s;}

function footer(){var f=el('footer');
 f.innerHTML='<p>Material didáctico propio del módulo <b>MP5021 · Incidentes de Ciberseguridade</b> (Curso de Especialización en Ciberseguridade en Contornos das TI), basado en la programación LOOIFP del IES Chan do Monte (Marín), curso 2026/2027, y en guías públicas de INCIBE-CERT y CCN-CERT.</p>'
 +'<p class="legal">Todas las herramientas ofensivas se usan <b>exclusivamente dentro de la red aislada del laboratorio</b> y sobre activos ficticios. OSINT y phishing solo contra objetivos de prueba propios, nunca contra terceros reales. Los títulos de las actividades se mantienen en gallego, tal como figuran en la programación oficial; el desarrollo está en castellano.</p>';
 return f;}

function buildNav(){var h='<li class="grp">Entorno</li>'
 +'<li><a href="#lab" class="udh" style="--udc:var(--accent)"><span class="n">LAB</span>El laboratorio</a></li>'
 +'<li><a href="#escenario" class="udh" style="--udc:var(--accent)"><span class="n">ESC</span>Escenario detallado</a></li>'
 +'<li data-ia="1"><a href="#ia" class="udh" style="--udc:var(--ia)"><span class="n">IA</span>Trabajar con IA</a></li>'
 +'<li class="grp">Resúmenes por unidad</li>';
 D.units.forEach(function(u){if(D.resumenes&&D.resumenes[u.id])h+='<li><a href="#res-'+u.id+'" class="udh" style="--udc:'+u.color+'"><span class="n">'+u.tag+'</span>Resumen de la '+u.tag+'</a></li>';});
 h+='<li class="grp">Unidades, actividades y tareas</li>';
 D.units.forEach(function(u){h+='<li><a href="#'+u.id+'" class="udh" style="--udc:'+u.color+'"><span class="n">'+u.tag+'</span>'+u.title+'</a></li>';
  u.acts.forEach(function(a){h+='<li class="sub"><a href="#act-'+a.n.replace('.','-')+'" class="subd" style="--udc:'+u.color+'"><span class="n">'+a.n+'</span>'+a.t+'</a></li>';});
  ((u.tareas&&u.tareas.items)||[]).forEach(function(t){h+='<li class="sub"><a href="#'+tarId(u,t)+'" style="--udc:'+u.color+'"><span class="n">T'+t.n+'</span>'+t.t+'</a></li>';});});
 h+='<li class="grp">Cierre</li>';
 
 h+='<li><a href="#eval" class="udh" style="--udc:var(--accent)"><span class="n">EVAL</span>Evaluación</a></li>';
 $('#navList').innerHTML=h;}

main.appendChild(hero());main.appendChild(labSection());main.appendChild(escenarioSection());main.appendChild(iaSection());
D.units.forEach(function(u){var r=resumenUnit(u);if(r)main.appendChild(r);var dt=detalleUnit(u);if(dt)main.appendChild(dt);main.appendChild(unitSection(u));});

function openTarget(){var id=decodeURIComponent(location.hash.slice(1));if(!id)return;var e=document.getElementById(id);if(e&&e.tagName==='DETAILS')e.open=true;}
window.addEventListener('hashchange',openTarget);openTarget();
$('#bitaPre').textContent=D.bitacora;

/* interacciones */
document.addEventListener('click',function(e){var b=e.target.closest('.copy');if(!b)return;var pre=b.closest('.code').querySelector('pre');var txt=pre.innerText;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){var o=b.textContent;b.textContent='copiado ✓';b.classList.add('ok');setTimeout(function(){b.textContent=o;b.classList.remove('ok');},1400);}).catch(function(){});});
(function(){var root=document.documentElement,tb=$('#themeBtn');tb.addEventListener('click',function(){var cur=root.getAttribute('data-theme');var dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('mp5021-theme',dark?'light':'dark');}catch(e){}});try{var t=localStorage.getItem('mp5021-theme');if(t)root.setAttribute('data-theme',t);}catch(e){}})();
(function(){var sw=$('#iaSwitch');function apply(on){document.body.classList.toggle('no-ia',!on);sw.setAttribute('aria-pressed',on?'true':'false');sw.querySelector('span:last-child').textContent=on?'Capa IA visible':'Capa IA oculta';}var on=true;try{on=localStorage.getItem('mp5021-ia')!=='0';}catch(e){}apply(on);sw.addEventListener('click',function(){on=!on;apply(on);try{localStorage.setItem('mp5021-ia',on?'1':'0');}catch(e){}});})();
(function(){var side=$('#side'),nt=$('#navToggle');if(nt)nt.addEventListener('click',function(){side.classList.toggle('open');});$('#navList').addEventListener('click',function(e){if(e.target.closest('a'))side.classList.remove('open');});})();
})();
